name: Deploy para Vercel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Instala a CLI da Vercel
        run: npm i -g vercel@latest

      # A CLI le os metadados git do checkout e a Vercel checa se o autor do
      # commit e membro do time. Sem .git nao ha autor a checar, entao qualquer
      # pessoa da organizacao pode publicar pelo token.
      - name: Remove metadados git
        run: rm -rf .git

      - name: Deploy de produção
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy de preview
        if: github.event_name == 'pull_request'
        run: vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }}
